name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "需要 gofmt 的檔案："
            echo "$out"
            exit 1
          fi
      - name: go vet
        run: |
          go vet ./...
          go vet -tags solution ./...
      - name: go test（練習題用參考解答）
        run: go test -race -tags solution ./...
      - name: 練習題的題目檔必須讓測試失敗
        run: |
          passed=$( (go test -json ./exercises/... || true) | jq -r 'select(.Action=="pass" and .Test!=null and (.Test|contains("/")|not)) | .Package+" "+.Test')
          if [ -n "$passed" ]; then
            echo "這些測試在還沒作答時就通過了，測試寫得太鬆："
            echo "$passed"
            exit 1
          fi
      - name: 頁面與程式碼同步
        run: go run ./tools/docsync -check
